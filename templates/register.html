<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta | FinanceHub</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- FinanceHub CSS -->
    <link
        href="{{ url_for('static', filename='styles.css') }}"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: #0f172a;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .auth-logo {
            color: #2563eb;
            font-size: 32px;
            font-weight: 750;
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 750;
            text-align: center;
        }

        .auth-subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->

            <div class="auth-logo">
                <i class="bi bi-wallet2 me-2"></i>
                FinanceHub
            </div>

            <!-- HEADER -->

            <h1 class="auth-title">
                Crie sua conta
            </h1>

            <p class="auth-subtitle">
                Comece a organizar sua vida financeira.
            </p>

            <!-- MESSAGES -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}

            <!-- REGISTER FORM -->

            <form action="/register" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- USERNAME -->

                <div class="mb-3">

                    <label for="username" class="form-label fw-semibold">
                        Nome de usuário
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        class="finance-input"
                        placeholder="Escolha um nome de usuário"
                        autocomplete="username"
                        maxlength="50"
                        required
                        autofocus
                    >

                </div>

                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="email" class="form-label fw-semibold">
                        E-mail
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        class="finance-input"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- PASSWORD -->

                <div class="mb-3">

                    <label for="password" class="form-label fw-semibold">
                        Senha
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        class="finance-input"
                        placeholder="Crie uma senha segura"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <div class="form-text">
                        Utilize pelo menos 8 caracteres.
                    </div>

                </div>

                <!-- CONFIRM PASSWORD -->

                <div class="mb-4">

                    <label for="confirmation" class="form-label fw-semibold">
                        Confirmar senha
                    </label>

                    <input
                        id="confirmation"
                        name="confirmation"
                        type="password"
                        class="finance-input"
                        placeholder="Digite sua senha novamente"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>

                <!-- SUBMIT BUTTON -->

                <button type="submit" class="btn-finance w-100">
                    <i class="bi bi-person-plus me-2"></i>
                    Criar minha conta
                </button>

            </form>

            <!-- LOGIN LINK -->

            <div class="auth-footer">

                Já possui uma conta?

                <a href="/login">
                    Entrar
                </a>

            </div>

            <!-- BACK LINK -->

            <div class="text-center mt-4">

                <a href="/" class="text-muted small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i>
                    Voltar à página inicial
                </a>

            </div>

        </div>

    </main>

</body>
</html>
